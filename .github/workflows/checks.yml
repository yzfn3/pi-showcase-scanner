name: Windows MVP checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find standalone or parent-repository layout
        shell: pwsh
        run: |
          if (Test-Path pi-showcase-scanner/requirements.txt) {
            "SCANNER_DIR=pi-showcase-scanner" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "SCANNER_DIR=." | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - run: python -m pip install -r requirements.txt
        working-directory: ${{ env.SCANNER_DIR }}
      - run: python -m unittest discover -s tests -v
        working-directory: ${{ env.SCANNER_DIR }}
